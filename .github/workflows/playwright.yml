name: Playwright Tests
on:
  # Every branch gets CI on push, so feature branches are covered before a PR exists.
  push:
    branches: ['**']
  # Kept only for pull requests from forks, where no push event fires against this
  # repo. Same-repo PRs are filtered out by the job's `if` below to avoid two
  # identical runs per commit.
  pull_request:
    branches: [main, master]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

# Supersede an in-flight run when the same branch is pushed again. The event name is
# part of the key so a pull_request run can never cancel its paired push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Run for push and workflow_dispatch always; for pull_request only when the head
    # repo differs from this one (i.e. a fork).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Cucumber smoke tests
      run: npm run test:cucumber:smoke
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: reports/allure-report/
        retention-days: 30
